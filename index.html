<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#0A5C4F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kuenta">
<meta name="description" content="Kuenta: tus finanzas personales y familiares, claras y seguras.">
<title>Kuenta</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-48.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Kuenta — app móvil de una sola pantalla con vistas y hojas inferiores */
:root{
  --bg:#F2F5F3; --bg-outer:#E2E9E5; --surface:#FFFFFF; --surface-2:#E6EDE9; --fg:#0F1B2D; --muted:#5B6A70;
  --line:#D8E2DD; --brand:#0B7F5C; --brand-2:#0A5C4F; --brand-soft:#DCF1E7; --on-brand:#FFFFFF;
  --card-a:#0A5C4F; --card-b:#13A26F; --accent:#F2A922;
  --gold:#A06C05; --gold-soft:#FBEFD3; --pos:#0E8A58; --pos-soft:#DDF3E8; --neg:#C42F3F; --neg-soft:#FBE3E6;
  --warn:#B86F00; --warn-soft:#FCEFD6; --shadow:rgba(10,50,40,.16); --scrim:rgba(8,20,18,.45);
  --f-display:'Sora', ui-sans-serif, system-ui, sans-serif;
  --f-body:'Manrope', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r:18px; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1513; --bg-outer:#050B0A; --surface:#12201C; --surface-2:#1B2C27; --fg:#E8F1ED; --muted:#93A69F;
  --line:#25372F; --brand:#34D399; --brand-2:#0E7A5E; --brand-soft:#173A2F; --on-brand:#04231A;
  --card-a:#0A5C4F; --card-b:#13A26F; --accent:#F6BE45;
  --gold:#F0BC4E; --gold-soft:#3A2E12; --pos:#4ADE9B; --pos-soft:#123629; --neg:#F26D7A; --neg-soft:#3D1A20;
  --warn:#F2B13F; --warn-soft:#3B2C10; --shadow:rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B1513; --bg-outer:#050B0A; --surface:#12201C; --surface-2:#1B2C27; --fg:#E8F1ED; --muted:#93A69F;
  --line:#25372F; --brand:#34D399; --brand-2:#0E7A5E; --brand-soft:#173A2F; --on-brand:#04231A;
  --card-a:#0A5C4F; --card-b:#13A26F; --accent:#F6BE45;
  --gold:#F0BC4E; --gold-soft:#3A2E12; --pos:#4ADE9B; --pos-soft:#123629; --neg:#F26D7A; --neg-soft:#3D1A20;
  --warn:#F2B13F; --warn-soft:#3B2C10; --shadow:rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.02em}
.ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.ic.sm svg{width:18px;height:18px}

#app{position:relative;height:100%;height:100dvh;max-width:440px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:600px){ body{background:var(--bg-outer);padding-block:20px;height:100dvh} #app{height:100%;border-radius:30px;border:1px solid var(--line);box-shadow:0 30px 80px -30px var(--shadow)} }
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:calc(12px + env(safe-area-inset-top,0px)) 18px 120px;overscroll-behavior:contain}
#view.full{padding:0}

#nav{position:absolute;left:0;right:0;bottom:0;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:end;z-index:5}
#nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
#nav button.on{color:var(--brand)}
#nav .fab{width:58px;height:58px;margin:-30px auto 0;border-radius:20px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;box-shadow:0 12px 24px -8px color-mix(in srgb,var(--brand) 70%,transparent)}
#nav .fab svg{width:26px;height:26px;stroke-width:2.2}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 14px}
.hello{display:flex;align-items:center;gap:12px;min-width:0}
.avatar{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;background:var(--brand-soft);color:var(--brand);flex:none;text-transform:uppercase}
.avatar.sm{width:26px;height:26px;border-radius:9px;font-size:11px}
.hello b{display:block;font-family:var(--f-display);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hello small{color:var(--muted);font-size:12.5px}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;position:relative;flex:none}
.dot{position:absolute;top:7px;right:7px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--neg);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid var(--surface)}
.subhead{display:flex;align-items:center;gap:10px;padding-block:8px 16px}
.subhead h1{font-size:21px;flex:1;min-width:0}
.section{margin-top:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.sec-h h2{font-size:16px}
.link{color:var(--brand);font-weight:700;font-size:13.5px}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)}

.cards{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-18px;padding:2px 18px 6px;scrollbar-width:none}
.cards::-webkit-scrollbar{display:none}
.acard{scroll-snap-align:start;flex:0 0 84%;max-width:330px;border-radius:24px;padding:18px 18px 16px;color:#fff;position:relative;overflow:hidden;min-height:170px;display:flex;flex-direction:column;text-align:left}
.acard::after{content:"";position:absolute;right:-40px;top:-50px;width:180px;height:180px;border-radius:50%;border:28px solid rgba(255,255,255,.07)}
.acard .row{display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative;z-index:1}
.acard .lbl{font-size:12.5px;opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard .bal{font-size:29px;font-weight:700;margin-top:6px;position:relative;z-index:1}
.acard .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;font-size:12px;position:relative;z-index:1}
.acard .foot span{opacity:.82}
.chip-w{background:rgba(255,255,255,.18);border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.mini{display:flex;gap:16px}
.mini div small{display:block;opacity:.75;font-size:11px}
.mini div b{font-family:var(--f-display);font-size:13.5px}
.acard.new{background:var(--surface);color:var(--fg);border:1.5px dashed var(--line);align-items:center;justify-content:center;gap:8px;text-align:center}
.acard.new::after{display:none}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.quick .q{width:100%;aspect-ratio:1.15;max-width:76px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--fg)}
.q.out{color:var(--neg)} .q.in{color:var(--pos)} .q.tr{color:var(--brand)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:11px 12px;min-width:0}
.stat small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.stat b{font-family:var(--f-display);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.stat.gen b{color:var(--gold)} .stat.inc b{color:var(--pos)}

.list{display:flex;flex-direction:column;gap:8px}
.tx{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;text-align:left;width:100%}
.tile{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:19px;flex:none}
.tx .mid{flex:1;min-width:0}
.tx .mid b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .mid small{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden}
.tx .amt{text-align:right;flex:none}
.tx .amt b{display:block;font-family:var(--f-display);font-variant-numeric:tabular-nums;font-size:14.5px}
.tx .amt small{color:var(--muted);font-size:11.5px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .gen{color:var(--gold)}
.dayh{font-size:12px;font-weight:700;color:var(--muted);text-transform:capitalize;margin:14px 2px 2px}
.empty{text-align:center;color:var(--muted);padding:28px 16px;border:1.5px dashed var(--line);border-radius:var(--r)}

.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--pos)}
.bar i.warn{background:var(--warn)} .bar i.over{background:var(--neg)} .bar i.brand{background:var(--brand)}
.bud{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;width:100%}
.bud .h{display:flex;align-items:center;gap:10px}
.bud .h .t{flex:1;min-width:0}
.bud .h .t b{display:block;font-weight:700}
.bud .h .t small{color:var(--muted);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--pos-soft);color:var(--pos)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.over{background:var(--neg-soft);color:var(--neg)}
.pill.brand{background:var(--brand-soft);color:var(--brand)} .pill.gold{background:var(--gold-soft);color:var(--gold)} .pill.mute{background:var(--surface-2);color:var(--muted)}

.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:8px 6px;border-radius:10px;font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 2px 8px -3px var(--shadow)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-18px;padding-inline:18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;margin-bottom:10px}
.search input{flex:1;border:0;background:none;padding:11px 0;outline:none;min-width:0}

.hub{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hub button{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;min-width:0}
.hub .hi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.hub b{font-weight:700;display:block}
.hub small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.inp{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:13px;padding:11px 12px;outline:none;min-width:0}
.inp:focus{border-color:var(--brand)}
.form{display:flex;flex-direction:column;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:15px;font-weight:800;font-size:15px;background:var(--brand);color:var(--on-brand)}
.btn:disabled,.btn[data-busy]{opacity:.5;cursor:progress}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.danger{background:var(--neg-soft);color:var(--neg)}
.btn.sm{width:auto;padding:9px 14px;font-size:13.5px;border-radius:12px}
.err{color:var(--neg);font-size:13px;font-weight:600}
.ok-msg{color:var(--pos);font-size:13.5px;font-weight:600}
.note{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:10px 12px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.toggle .t{min-width:0}
.toggle .t b{display:block;font-weight:700}
.toggle .t small{color:var(--muted);font-size:12px}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);transition:.2s;pointer-events:none}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px var(--shadow);transition:.2s}
.sw input:checked+span{background:var(--brand);border-color:var(--brand)}
.sw input:checked+span::after{left:21px}
.sw input:disabled+span{opacity:.45}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:8px}
.swatches button,.swc{width:100%;aspect-ratio:1;border-radius:10px;border:2px solid transparent}
.swatches button.on,.swc.on{border-color:var(--fg);box-shadow:inset 0 0 0 2px var(--surface)}
.swc{position:relative;display:grid;place-items:center;cursor:pointer;background:conic-gradient(#E11D48,#F97316,#EAB308,#22C55E,#06B6D4,#2563EB,#9333EA,#E11D48)}
.swc span{width:60%;aspect-ratio:1;border-radius:50%;background:var(--surface);color:var(--fg);display:grid;place-items:center;font-weight:800;font-size:14px;line-height:1}
.swc.on span{display:none}
.swc input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.emopick{max-height:248px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.eg small{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px 2px}
.emocustom{display:flex;align-items:center;gap:10px;margin-top:8px}
.emoprev{width:44px;height:44px;flex:none;border-radius:13px;display:grid;place-items:center;font-size:22px;background:var(--brand-soft)}
.accprev{--c:#0B7F5C;display:flex;align-items:center;gap:12px;padding:16px;border-radius:20px;color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));box-shadow:0 14px 28px -16px var(--c);position:relative;overflow:hidden;transition:background .25s}
.accprev::after{content:"";position:absolute;right:-30px;top:-40px;width:130px;height:130px;border-radius:50%;border:20px solid rgba(255,255,255,.08)}
.accprev .ai{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:21px;flex:none}
.accprev b{display:block;font-family:var(--f-display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.accprev small{opacity:.85;font-size:12.5px}
.accprev div{min-width:0}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emojis button{aspect-ratio:1;border-radius:10px;font-size:19px;background:var(--surface-2)}
.emojis button.on{background:var(--brand-soft);box-shadow:inset 0 0 0 2px var(--brand)}

#sheet{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
#sheet .scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .2s}
#sheet .panel-s{position:relative;background:var(--bg);border-radius:26px 26px 0 0;max-height:92%;overflow-y:auto;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .25s cubic-bezier(.2,.8,.2,1)}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sheet-h h2{font-size:19px;min-width:0}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}

.amount{text-align:center;padding:14px 0 6px}
.amount .num{font-size:44px;font-weight:700;display:block;line-height:1.1;word-break:break-all}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.keys button{padding:14px 0;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-display);font-size:21px;font-weight:600}
.keys button:active{background:var(--surface-2)}
.accsel{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-18px;padding:2px 18px}
.accsel::-webkit-scrollbar{display:none}
.accsel button{flex:none;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 12px;font-weight:700;font-size:13px;text-align:left}
.accsel button small{display:block;font-weight:600;color:var(--muted);font-size:11px}
.accsel button.on{border-color:var(--brand);background:var(--brand-soft)}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.catgrid button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:15px;background:var(--surface);border:1.5px solid var(--line);font-size:11.5px;font-weight:700;line-height:1.2;text-align:center;min-width:0;overflow-wrap:anywhere}
.catgrid button span.e{font-size:22px}
.catgrid button.on{border-color:var(--brand);background:var(--brand-soft)}
.receipt{border-radius:14px;border:1px solid var(--line);overflow:hidden;background:var(--surface)}
.receipt img{display:block;width:100%;max-height:340px;object-fit:contain;background:var(--surface-2)}
.upload{display:flex;align-items:center;gap:10px;padding:12px;border:1.5px dashed var(--line);border-radius:14px;color:var(--muted);font-weight:700;cursor:pointer;position:relative}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}

#toast{position:absolute;left:14px;right:14px;bottom:98px;z-index:30;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:auto;background:var(--fg);color:var(--bg);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px;box-shadow:0 14px 30px -10px var(--shadow);animation:up .25s}
.toast button{margin-left:auto;background:var(--bg);color:var(--fg);border-radius:10px;padding:7px 10px;font-weight:800;font-size:12.5px;white-space:nowrap}

.lock{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:calc(40px + env(safe-area-inset-top,0px)) 24px 40px;background:radial-gradient(120% 70% at 50% 0%,var(--brand-soft),var(--bg) 70%)}
.lock .form{width:100%;max-width:340px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:46px;height:46px;border-radius:15px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:23px;letter-spacing:-.04em}
.word{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:-.03em}
.logo{width:52px;height:52px;display:block;filter:drop-shadow(0 8px 16px rgba(10,90,70,.25))}
.logo.sm{width:32px;height:32px;filter:none}
.dots{display:flex;gap:16px;margin:6px 0;justify-content:center}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.dots i.f{background:var(--brand);border-color:var(--brand)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.lock .keys{width:100%;max-width:300px}
.lock .keys button{background:var(--surface);border-radius:50%;aspect-ratio:1;padding:0;max-width:78px;justify-self:center;width:100%}
.finger{display:flex;align-items:center;gap:8px;color:var(--brand);font-weight:800;padding:10px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.textbtn{color:var(--brand);font-weight:700;font-size:14px}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface-2);border-top-color:var(--brand);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.legend{display:flex;flex-direction:column;gap:8px}
.legend .li{display:flex;align-items:center;gap:10px}
.legend .li i{width:10px;height:10px;border-radius:3px;flex:none}
.legend .li span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .li b{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-size:13px}
.legend .li small{color:var(--muted);width:44px;text-align:right;font-variant-numeric:tabular-nums}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:13px}
.member{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.member:last-child{border-bottom:0}
.member .t{flex:1;min-width:0}
.member .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member .t small{color:var(--muted);font-size:12px}
table.rep{width:100%;border-collapse:collapse;font-size:13px}
table.rep td,table.rep th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
table.rep th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
table.rep td.r,table.rep th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
/* resumen del mes */
.month{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:10px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt{position:relative;border-radius:16px;padding:12px 12px 11px;min-width:0;background:var(--surface-2)}
.mt small{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:8px 0 2px}
.mi{width:30px;height:30px;border-radius:10px;display:grid;place-items:center}
.mt.inc{background:var(--pos-soft)} .mt.inc .mi{background:var(--pos);color:var(--bg)} .mt.inc .big{color:var(--pos)}
.mt.exp{background:var(--neg-soft)} .mt.exp .mi{background:var(--neg);color:var(--bg)} .mt.exp .big{color:var(--neg)}
.mt.gen{background:var(--gold-soft)} .mt.gen .mi{background:var(--gold);color:var(--bg)} .mt.gen .big{color:var(--gold)}
.big{display:block;font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.big.s{font-size:20px} .big.xs{font-size:17px}
.big .cur{font-size:.62em;font-weight:600;margin-right:3px;opacity:.8}
.big .dec{font-size:.58em;font-weight:600;opacity:.7}
.mt.wide{display:flex;align-items:center;gap:12px}
.mt.wide .mtx{flex:1;min-width:0}
.mt.wide .mtx small{margin-top:0}
.mleft{text-align:right;flex:none}
.mleft small{margin:0 0 2px;color:var(--muted)}
.mleft b{font-family:var(--f-display);font-size:15px;font-variant-numeric:tabular-nums;color:var(--fg);white-space:nowrap}
.mleft.neg b{color:var(--neg)}
.mbar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface-2);gap:2px}
.mbar i{display:block;height:100%;border-radius:99px}
.mbar .e,.mleg .e{background:var(--neg)} .mbar .g,.mleg .g{background:var(--gold)} .mbar .l,.mleg .l{background:var(--pos)}
.mleg{display:flex;gap:14px;font-size:11.5px;font-weight:600;color:var(--muted);padding:0 2px}
.mleg span{display:flex;align-items:center;gap:5px}
.mleg i{width:8px;height:8px;border-radius:3px;display:block}
/* diezmo */
.tithe{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px}
.th-top{display:flex;align-items:center;gap:12px}
.tithe .mi{background:var(--gold);color:var(--bg);flex:none}
.th-tx{flex:1;min-width:0}
.th-tx small{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.th-tx .big{color:var(--gold)}
.tithe.done .th-tx .big{color:var(--pos)}
.th-foot{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.th-foot b{color:var(--fg);font-variant-numeric:tabular-nums}
.th-note{margin-top:10px;font-size:12.5px;color:var(--muted);background:var(--gold-soft);border-radius:12px;padding:9px 11px}
.th-note .link{font-size:12.5px}
/* confirmar correo */
.verify{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
.verify .vi{width:64px;height:64px;border-radius:20px;margin:0 auto;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.verify .vi svg{width:30px;height:30px}
.vsteps{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px 14px}
.vs{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.vs:last-child{border-bottom:0}
.vs>span{width:26px;height:26px;flex:none;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:800;font-size:13px}
.vs b{display:block;font-size:14px}
.vs small{display:block;color:var(--muted);font-size:12.5px;line-height:1.4;margin-top:2px}
.vs small b{display:inline;font-size:inherit;color:var(--fg)}
a.btn{text-decoration:none}
/* crédito de Somar Labs */
.credit{display:flex;align-items:center;justify-content:center;gap:6px;margin:14px auto 6px;font-size:12px;color:var(--muted)}
.credit img{width:18px;height:18px}
.credit b{color:var(--fg);font-weight:700}
code.tok{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;background:var(--surface-2);padding:8px 10px;border-radius:10px;user-select:all}
/* contraseña visible y recordar correo */
.pw{position:relative}
.pw .inp{padding-right:48px}
.pweye{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.pweye:hover{color:var(--fg)}
.check{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--brand);margin:0}
/* ahorro, deudas, pagos programados y recordatorios */
.hero{border-radius:24px;padding:18px;color:#fff;background:linear-gradient(140deg,var(--card-a),var(--card-b));position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-50px;width:180px;height:180px;border-radius:50%;border:28px solid rgba(255,255,255,.08);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero.debt{background:linear-gradient(140deg,#7F1D1D,#C42F3F)}
.hero .eyebrow{color:rgba(255,255,255,.82)}
.hero .big{color:#fff;font-size:32px}
.hero small{opacity:.9}
.row3{display:flex;gap:18px;margin-top:12px;flex-wrap:wrap}
.row3 small{display:block;font-size:11.5px;opacity:.78}
.row3 b{font-family:var(--f-display);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hero .btn{background:#fff;color:#0A5C4F}
.hero .btn.ghost{background:rgba(255,255,255,.18);color:#fff}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.slots button{aspect-ratio:1;border-radius:10px;background:var(--surface-2);font-weight:800;font-size:12.5px;color:var(--muted);font-family:var(--f-display)}
.slots button.on{background:var(--brand);color:var(--on-brand)}
.slots button.now{box-shadow:inset 0 0 0 2px var(--accent)}
.slots button.pick{animation:pop .7s;box-shadow:inset 0 0 0 3px var(--accent)}
@keyframes pop{40%{transform:scale(1.3)}}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:11px;font-weight:700;padding:10px 4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);line-height:1.2}
.badge span{font-size:24px}
.badge.off{opacity:.38;filter:grayscale(1)}
.tips{display:flex;flex-direction:column;gap:8px}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;font-size:13.5px}
.tip>span{font-size:20px;line-height:1.2;flex:none}
.chcard{scroll-snap-align:start;flex:0 0 66%;max-width:250px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;position:relative}
.chcard .e{font-size:30px}
.chcard b{font-family:var(--f-display);font-size:15px}
.chcard small{color:var(--muted);font-size:12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chcard .viral{position:absolute;top:12px;right:12px}
.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cmp>div{background:var(--surface-2);border-radius:14px;padding:10px;min-width:0}
.cmp>div.best{background:var(--pos-soft);box-shadow:inset 0 0 0 1.5px var(--pos)}
.cmp small{display:block;font-size:11px;font-weight:700;color:var(--muted)}
.cmp b{display:block;font-family:var(--f-display);font-size:15px;white-space:nowrap}
.timechip{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.timechip .inp{flex:1}
.lvl{display:flex;align-items:center;gap:12px;min-width:0}
.lvl .e{font-size:28px;width:50px;height:50px;border-radius:16px;background:var(--gold-soft);display:grid;place-items:center;flex:none}
.lvl b{font-family:var(--f-display)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app">
  <main id="view" class="full"><div class="lock"><div class="brand"><img class="logo" src="icons/logo-mark.png" alt="" width="52" height="52"><div class="word">Kuenta</div></div><div class="spin" role="status" aria-label="Cargando"></div></div></main>
  <nav id="nav" hidden></nav>
  <div id="toast" aria-live="polite"></div>
  <div id="sheet" hidden></div>
</div>
<noscript><p style="padding:20px">Kuenta necesita JavaScript activado.</p></noscript>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
